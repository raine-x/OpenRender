language = "C"
include_guard = "OPENRENDER_H"
pragma_once = true
cpp_compat = true
documentation = true
line_length = 100
tab_width = 4

header = """
/* OpenRender - streaming Markdown engine (C ABI).
 *
 * Generated by cbindgen from crates/openrender-core/src/ffi.rs.
 * Regenerate with:
 *   cbindgen --config cbindgen.toml --crate openrender-core --output include/engine.h
 *
 * All strings returned by this API are heap-allocated and must be released
 * with or_string_free(). Engine handles must be released with or_engine_free().
 */"""

trailer = "/* end of engine.h */"

[parse]
parse_deps = false
include = []

[export]
include = [
    "OrConfig",
    "OrEngine",
    "OrMathImage",
    "OrMathRenderFn",
    "OrMathFreeFn",
    "OrParseFlag",
]

[enum]
prefix_with_name = true
