[workspace]
members = ["crates/openrender-core", "crates/openrender-latex"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
